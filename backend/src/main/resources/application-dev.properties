# Dev profile: start-dev.ps1 runs `mvnw.cmd spring-boot:run` with SPRING_PROFILES_ACTIVE=dev.
# Everything not set here comes from application.properties.

# H2 Console for looking at the data while developing. Like the rest of the app it is
# reachable from this machine only (server.address). Connect with the URL it shows,
# user sa, empty password.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DevTools LiveReload listens on every network adapter (port 35729), not on server.address.
# Spring Boot 4 turns it off by default; the frontend reloads through Vite anyway (BE-10).
spring.devtools.livereload.enabled=false
