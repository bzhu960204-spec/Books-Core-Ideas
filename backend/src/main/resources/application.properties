spring.application.name=books-core-ideas
server.port=8080
# No login: only this machine may connect (SEC-03). An IP, not "localhost", which can
# resolve to ::1 alone; browsers still open http://localhost:<port> (they fall back to IPv4).
server.address=127.0.0.1

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/booksdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# The schema comes from Flyway alone (db/migration); Hibernate only checks that the
# entities match it and refuses to start otherwise. Schema changes = new V<n> script.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Data is loaded inside service transactions and returned as DTOs; nothing may
# rely on lazy loading while the response is being written.
spring.jpa.open-in-view=false

# Flyway — the only source of the schema (see doc/database-schema-and-flyway.md).
# baseline-on-migrate=true lets Flyway adopt a database that predates Flyway (created
# by Hibernate); baseline-version=0 means V1+ still run on it. V0 builds the base
# tables on empty databases and is skipped on adopted ones.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# H2 Console: dev only (application-prod.properties turns it off). Reachable only from
# this machine, like the rest of the app (server.address).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload (large limits allow importing multi-book migration archives)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB

# CORS — overridden by APP_CORS_ALLOWED_ORIGINS env var at runtime
app.cors.allowed-origins=http://localhost:5173
