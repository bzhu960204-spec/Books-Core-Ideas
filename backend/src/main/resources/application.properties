spring.application.name=books-core-ideas
# Settings shared by every profile, and safe on their own: running without a profile
# (java -jar, an IDE) gets no dev tools. Profiles (BE-09):
#   dev  - start-dev.ps1: adds the H2 Console (application-dev.properties)
#   prod - start-prod.ps1: application-prod.properties
#   test - automated tests: in-memory database (src/test/resources)
server.port=8080
# No login: only this machine may connect (SEC-03). An IP, not "localhost", which can
# resolve to ::1 alone; browsers still open http://localhost:<port> (they fall back to IPv4).
server.address=127.0.0.1

# H2 Database
# No AUTO_SERVER: it starts a TCP server on every network adapter so other processes can
# share the database (SEC-03). A second process now fails with "already in use" instead.
spring.datasource.url=jdbc:h2:file:./data/booksdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# The schema comes from Flyway alone (db/migration); Hibernate only checks that the
# entities match it and refuses to start otherwise. Schema changes = new V<n> script.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Data is loaded inside service transactions and returned as DTOs; nothing may
# rely on lazy loading while the response is being written.
spring.jpa.open-in-view=false

# Flyway — the only source of the schema (see doc/database-schema-and-flyway.md).
# baseline-on-migrate=true lets Flyway adopt a database that predates Flyway (created
# by Hibernate); baseline-version=0 means V1+ still run on it. V0 builds the base
# tables on empty databases and is skipped on adopted ones.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# H2 Console: reads and changes every table, so only the dev profile turns it on.
spring.h2.console.enabled=false

# Actuator: only /actuator/health, answering just {"status":"UP"} (UP needs the database).
# The start scripts wait for it instead of for the port (ENG-06).
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Spring Boot 4 adds liveness/readiness groups (/actuator/health/liveness, a "groups" field);
# nothing here uses them (BE-10).
management.endpoint.health.probes.enabled=false

# JSON (Jackson 3 since Spring Boot 4, BE-10). Two of its new defaults would change the API:
# - a missing or null flag ("highlighted") would be a 400 instead of false;
# - fields of plain classes (ProblemDetail) would be sorted alphabetically.
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.mapper.sort-properties-alphabetically=false

# File upload (large limits allow importing multi-book migration archives)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB

# CORS: off. Dev (Vite proxy) and prod (single port) are same-origin. For a frontend on
# another origin, set APP_CORS_ALLOWED_ORIGINS to a comma-separated list of origins.
app.cors.allowed-origins=
