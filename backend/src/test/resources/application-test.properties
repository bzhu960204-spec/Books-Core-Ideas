# Test profile: isolated in-memory database per Spring context, never the real data.
spring.datasource.url=jdbc:h2:mem:bci-${random.uuid};DB_CLOSE_DELAY=-1
# Schema must come from Flyway alone; Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
app.upload.dir=${java.io.tmpdir}/bci-test-images
# Statement counts for N+1 regression tests; keep Hibernate's per-session metrics out of the log.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
